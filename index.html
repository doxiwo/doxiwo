<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Man's Pro Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Line Score Table -->
        <table id="line-score">
            <thead>
                <tr id="inning-headers">
                    <th>Teams</th>
                    <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                    <th class="total">R</th>
                </tr>
            </thead>
            <tbody>
                <tr id="away-line">
                    <td>Away</td>
                    <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
                    <td class="total" id="away-total">0</td>
                </tr>
                <tr id="home-line">
                    <td>Home</td>
                    <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
                    <td class="total" id="home-total">0</td>
                </tr>
            </tbody>
        </table>

        <div id="broadcast-header">
            <div id="inning-display">Inning: <span id="inning-num">1</span>st (<span id="inning-half">Top</span>)</div>
            <div id="outs-display">Outs: <span id="outs-dots"></span></div>
        </div>

        <div id="batter-card">
            <div id="batter-name">BIG MAN</div>
            <div id="batter-stats">AVG: <span id="avg">.000</span> | <span id="current-team">Sandlot League</span></div>
            <div id="session-status">AB: <span id="ab-count">0</span>/3</div>
        </div>
        
        <div id="stats-bar">
            <div class="stat">Strikes: <span id="strikes">0</span></div>
            <div class="stat">Balls: <span id="balls">0</span></div>
        </div>

        <div id="field">
            <div id="diamond">
                <div id="base-3" class="base"></div>
                <div id="base-2" class="base"></div>
                <div id="base-1" class="base"></div>
            </div>

            <div id="strike-zone"></div>
            <div id="ball"></div>
            <div id="bat"></div>
        </div>

        <div id="settings">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div id="controls">
            <button id="swing-btn" disabled>Swing! (Space)</button>
        </div>

        <div id="message">Big Man is stepping in...</div>

        <!-- Career Notifications -->
        <div id="notification-overlay" class="hidden">
            <div id="notification-content">
                <h2 id="notif-title">CONTRACT OFFER!</h2>
                <p id="notif-body">The NY Yankees are offering a contract.</p>
                <button id="notif-btn">Sign Contract</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
