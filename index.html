<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Man: Hard Pro Career</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Professional Line Score -->
        <div id="scoreboard-container">
            <table id="line-score">
                <thead>
                    <tr>
                        <th>TEAM</th>
                        <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th>
                        <th class="total-col">R</th><th class="total-col">H</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="away-row">
                        <td class="team-name">AWAY</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                        <td class="total-val" id="away-runs">0</td><td class="total-val" id="away-hits">0</td>
                    </tr>
                    <tr id="home-row">
                        <td class="team-name">HOME</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                        <td class="total-val" id="home-runs">0</td><td class="total-val" id="home-hits">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="broadcast-bar">
            <div id="inning-box"><span id="inning-half">TOP</span> <span id="inning-num">1</span></div>
            <div id="count-box">
                <div class="count-item">S <span id="strikes">0</span></div>
                <div class="count-item">B <span id="balls">0</span></div>
                <div class="count-item">O <span id="outs-dots"></span></div>
            </div>
        </div>

        <div id="batter-card">
            <div class="batter-header">SESSION: <span id="ab-session">1</span>/3 AT-BATS</div>
            <div id="batter-name">BIG MAN</div>
            <div id="batter-stats">
                AVG: <span id="avg">.000</span> (<span id="career-hits">0</span>/<span id="career-abs">0</span>)
                <br>
                <span id="current-team">STREET LEAGUE</span>
            </div>
        </div>

        <div id="field">
            <div id="diamond">
                <div id="base-3" class="base"></div>
                <div id="base-2" class="base"></div>
                <div id="base-1" class="base"></div>
            </div>
            <div id="strike-zone"></div>
            <div id="ball"></div>
            <div id="bat"></div>
            
            <!-- Dynamic Result Overlay -->
            <div id="result-overlay" class="hidden">
                <div id="result-text">HOME RUN!!</div>
            </div>
        </div>

        <div id="controls">
            <button id="swing-btn" disabled>SWING! (SPACE)</button>
        </div>

        <div id="status-message">PREPARING...</div>

        <button id="restart-btn">RESET CAREER</button>

        <!-- Career Notifications -->
        <div id="notification-overlay" class="hidden">
            <div id="notification-content">
                <h2 id="notif-title">OFFER!</h2>
                <p id="notif-body">Team message here.</p>
                <button id="notif-btn">SIGN CONTRACT</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
