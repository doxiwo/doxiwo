<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Baseball Game</h1>
    <div id="game">
        <div id="scoreboard">
            <p>Strikes: <span id="strikes">0</span></p>
            <p>Balls: <span id="balls">0</span></p>
            <p>Outs: <span id="outs">0</span></p>
        </div>
        <button id="pitch">Pitch</button>
        <div id="result"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
