<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Baseball - 9th Inning Bottom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <h1>Action Baseball</h1>
            <div id="inning-display">9th (Bottom)</div>
        </div>
        
        <div id="scoreboard">
            <div class="score-team">Away: <span id="away-score">0</span></div>
            <div class="score-team">Home: <span id="home-score">0</span></div>
        </div>

        <div id="stats-bar">
            <div class="stat">S: <span id="strikes">0</span></div>
            <div class="stat">B: <span id="balls">0</span></div>
            <div class="stat">O: <span id="outs">2</span></div>
        </div>

        <div id="field">
            <!-- Diamond Mini-map -->
            <div id="diamond">
                <div id="base-3" class="base"></div>
                <div id="base-2" class="base"></div>
                <div id="base-1" class="base"></div>
            </div>

            <div id="strike-zone"></div>
            <div id="ball"></div>
            <div id="bat"></div>
        </div>

        <div id="settings">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div id="controls">
            <button id="swing-btn" disabled>Swing! (Space)</button>
        </div>

        <div id="message">Next pitch in 3s...</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
