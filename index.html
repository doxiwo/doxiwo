<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Baseball Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Action Baseball</h1>
        
        <div id="scoreboard">
            <div class="stat">Strikes: <span id="strikes">0</span></div>
            <div class="stat">Balls: <span id="balls">0</span></div>
            <div class="stat">Outs: <span id="outs">0</span></div>
            <div class="stat">Runs: <span id="runs">0</span></div>
        </div>

        <div id="field">
            <div id="strike-zone"></div>
            <div id="ball"></div>
        </div>

        <div id="controls">
            <button id="pitch-btn">Pitch</button>
            <button id="swing-btn" disabled>Swing!</button>
        </div>

        <div id="message">Press 'Pitch' to start!</div>
    </div>
    <script src="main.js"></script>
</body>
</html>
